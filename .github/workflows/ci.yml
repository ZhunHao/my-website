name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.21"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun x astro check

      # Build + HTML/link lint. Astro's `inferRemoteSize` fetches every
      # `image.src` URL from www.wongzhunhao.com to determine dimensions;
      # those fetches are intermittently flaky on GitHub-hosted runners,
      # so we retry up to 5 times before failing the job.
      - name: Build + lint (HTML + links) with retry
        env:
          MAX_ATTEMPTS: 5
          RETRY_INTERVAL: 30
        run: |
          attempt=1
          until bun run lint:site; do
            if [ $attempt -ge $MAX_ATTEMPTS ]; then
              echo "lint:site failed after $MAX_ATTEMPTS attempts."
              exit 1
            fi
            echo "Attempt $attempt failed. Retrying in $RETRY_INTERVAL seconds..."
            sleep $RETRY_INTERVAL
            attempt=$((attempt + 1))
          done
